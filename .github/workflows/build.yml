      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Install CMake & Ninja
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build

      - name: Configure
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared

      - name: Build + package
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cmake --build build --target TargetHUD -j$(nproc)
          cmake --build build --target levi_package -j$(nproc)
          echo "=== package contents ==="
          unzip -l build/*.levipack
          echo "=== NEEDED libs (must include libpreloader.so like TotemTweaks) ==="
          # Prefer llvm-readelf from NDK
          READELF=$(find "$ANDROID_NDK_HOME" -name "llvm-readelf" | head -1)
          if [ -n "$READELF" ]; then
            "$READELF" -d build/libTargetHUD.so | grep NEEDED || true
          else
            readelf -d build/libTargetHUD.so | grep NEEDED || true
          fi
          ls -la build/*.levipack

      - name: Upload levipack
        uses: actions/upload-artifact@v4
        with:
          name: TargetHUD-1.0.1-arm64-v8a
          path: build/*.levipack
          if-no-files-found: error
