      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Install CMake & Ninja
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build

      - name: Configure
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cmake -S . -B build-arm64-v8a \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DMOD_ID=soupvisuals \
            -DMOD_NAME="Soup Visuals" \
            -DMOD_AUTHOR="Grok" \
            -DMOD_VERSION=0.1.0 \
            -DMOD_LIBRARY_NAME=soupvisuals \
            -DMOD_MINECRAFT_VERSIONS='["1.26.*"]'

      - name: Build + package
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cmake --build build-arm64-v8a --target soupvisuals -j$(nproc)
          cmake --build build-arm64-v8a --target levi_package -j$(nproc)
          ls -la build-arm64-v8a/*.levipack
          cat build-arm64-v8a/manifest.json 2>/dev/null || true

      - name: Upload levipack
        uses: actions/upload-artifact@v4
        with:
          name: soupvisuals-0.1.0-arm64-v8a
          path: build-arm64-v8a/*.levipack
          if-no-files-found: error
