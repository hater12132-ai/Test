name: Build Aspect Ratio levipack

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build arm64-v8a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Install CMake & Ninja
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build

      - name: Configure
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cmake -S . -B build-arm64-v8a \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DMOD_ID=aspectratio \
            -DMOD_NAME="Aspect Ratio" \
            -DMOD_AUTHOR="Grok" \
            -DMOD_VERSION=1.0.0 \
            -DMOD_LIBRARY_NAME=aspectratio \
            -DMOD_MINECRAFT_VERSIONS='["1.26.44"]'

      - name: Build library + package
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cmake --build build-arm64-v8a --target aspectratio -j$(nproc)
          cmake --build build-arm64-v8a --target levi_package -j$(nproc)

      - name: Upload levipack
        uses: actions/upload-artifact@v4
        with:
          name: aspectratio-1.0.0-arm64-v8a
          path: build-arm64-v8a/*.levipack
          if-no-files-found: error
