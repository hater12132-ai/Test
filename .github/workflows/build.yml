name: Build Aspect Ratio levipack

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create project files
        run: |
          mkdir -p config src/mod

          cat > CMakeLists.txt << 'ENDOFFILE'
cmake_minimum_required(VERSION 3.22)

project(AspectRatioMod LANGUAGES CXX)

set(CMAKE_CXX_STANDARD 20)
set(CMAKE_CXX_STANDARD_REQUIRED ON)
set(CMAKE_CXX_EXTENSIONS OFF)
set(CMAKE_POSITION_INDEPENDENT_CODE ON)

set(MOD_ID "aspectratio" CACHE STRING "LeviLauncher mod package directory name")
set(MOD_NAME "Aspect Ratio" CACHE STRING "LeviLauncher mod display name")
set(MOD_AUTHOR "Grok" CACHE STRING "LeviLauncher mod author")
set(MOD_VERSION "1.0.0" CACHE STRING "LeviLauncher mod version")
set(MOD_LIBRARY_NAME "aspectratio" CACHE STRING "Native library name without lib prefix or .so suffix")
set(MOD_MINECRAFT_VERSIONS "[\"1.26.44\"]" CACHE STRING "Raw JSON array for manifest minecraft_versions")
set(MOD_ICON "" CACHE STRING "Optional package-relative icon path")

include(FetchContent)

FetchContent_Declare(
    preloader_android
    GIT_REPOSITORY https://github.com/LiteLDev/preloader-android.git
    GIT_TAG 0.2.2
)
FetchContent_Declare(
    nlohmann_json
    GIT_REPOSITORY https://github.com/nlohmann/json.git
    GIT_TAG v3.11.3
)
FetchContent_Declare(
    boost_pfr
    GIT_REPOSITORY https://github.com/boostorg/pfr.git
    GIT_TAG boost-1.88.0
)
FetchContent_Declare(
    magic_enum
    GIT_REPOSITORY https://github.com/Neargye/magic_enum.git
    GIT_TAG v0.9.7
)
FetchContent_Declare(
    fmt
    GIT_REPOSITORY https://github.com/fmtlib/fmt.git
    GIT_TAG 11.2.0
)
set(FMT_DOC OFF CACHE BOOL "Disable fmt docs" FORCE)
set(FMT_TEST OFF CACHE BOOL "Disable fmt tests" FORCE)
set(FMT_INSTALL OFF CACHE BOOL "Disable fmt install rules" FORCE)
FetchContent_MakeAvailable(preloader_android nlohmann_json boost_pfr magic_enum fmt)

FetchContent_GetProperties(preloader_android)
set(LEVI_PRELOADER_INCLUDE_DIR "${preloader_android_SOURCE_DIR}/include")

if(NOT ANDROID)
    message(STATUS "Non-Android configure – only config generator available")
    return()
endif()

if(NOT DEFINED LEVI_PACKAGE_CONFIG_DIR)
    set(LEVI_PACKAGE_CONFIG_DIR "${CMAKE_CURRENT_SOURCE_DIR}/config" CACHE PATH
        "Directory containing config.json and config.schema.json to package")
endif()

get_filename_component(LEVI_PACKAGE_CONFIG_DIR "${LEVI_PACKAGE_CONFIG_DIR}" ABSOLUTE)

option(LEVI_LINK_PRELOADER
       "Build and link the preloader target instead of leaving SDK symbols for runtime lookup"
       OFF)

if(LEVI_LINK_PRELOADER AND NOT TARGET preloader)
    add_subdirectory("${preloader_android_SOURCE_DIR}" "${CMAKE_BINARY_DIR}/_preloader_android")
endif()

add_library(${MOD_LIBRARY_NAME} SHARED
    src/main.cpp
    src/mod/Config.cpp
    src/mod/AspectRatioMod.cpp
)

set_target_properties(${MOD_LIBRARY_NAME} PROPERTIES
    OUTPUT_NAME "${MOD_LIBRARY_NAME}"
)

target_include_directories(${MOD_LIBRARY_NAME}
    PRIVATE
        src
        "${LEVI_PRELOADER_INCLUDE_DIR}"
)

target_compile_options(${MOD_LIBRARY_NAME}
    PRIVATE
        $<$<COMPILE_LANG_AND_ID:CXX,Clang,GNU>:-fvisibility=hidden -fvisibility-inlines-hidden>
)

target_link_options(${MOD_LIBRARY_NAME}
    PRIVATE
        "-Wl,-z,max-page-size=16384"
)

find_library(log-lib log REQUIRED)
target_link_libraries(${MOD_LIBRARY_NAME} PRIVATE
    ${log-lib}
    nlohmann_json::nlohmann_json
    Boost::pfr
    magic_enum::magic_enum
    fmt::fmt
)

if(TARGET preloader)
    target_link_libraries(${MOD_LIBRARY_NAME} PRIVATE preloader)
else()
    # Symbols (hook, signature, modmenu) are provided at runtime by Preloader
    target_link_options(${MOD_LIBRARY_NAME} PRIVATE
        "-Wl,--unresolved-symbols=ignore-all")
endif()

if(CMAKE_STRIP)
    add_custom_command(TARGET ${MOD_LIBRARY_NAME} POST_BUILD
        COMMAND "${CMAKE_STRIP}" --strip-unneeded "$<TARGET_FILE:${MOD_LIBRARY_NAME}>"
        COMMENT "Stripping symbols"
        VERBATIM
    )
endif()

configure_file(
    "${CMAKE_CURRENT_SOURCE_DIR}/manifest.json.in"
    "${CMAKE_CURRENT_BINARY_DIR}/manifest.json"
    @ONLY
)

set(LEVI_PACKAGE_ROOT "${CMAKE_CURRENT_BINARY_DIR}/package")
set(LEVI_PACKAGE_MOD_DIR "${LEVI_PACKAGE_ROOT}/${MOD_ID}")
set(LEVI_PACKAGE_FILE "${CMAKE_CURRENT_BINARY_DIR}/${MOD_ID}-${MOD_VERSION}-${CMAKE_ANDROID_ARCH_ABI}.levipack")

add_custom_target(levi_package
    COMMAND "${CMAKE_COMMAND}" -E rm -rf "${LEVI_PACKAGE_ROOT}"
    COMMAND "${CMAKE_COMMAND}" -E make_directory "${LEVI_PACKAGE_MOD_DIR}"
    COMMAND "${CMAKE_COMMAND}" -E copy "$<TARGET_FILE:${MOD_LIBRARY_NAME}>" "${LEVI_PACKAGE_MOD_DIR}/lib${MOD_LIBRARY_NAME}.so"
    COMMAND "${CMAKE_COMMAND}" -E copy "${CMAKE_CURRENT_BINARY_DIR}/manifest.json" "${LEVI_PACKAGE_MOD_DIR}/manifest.json"
    COMMAND "${CMAKE_COMMAND}" -E copy_directory "${LEVI_PACKAGE_CONFIG_DIR}" "${LEVI_PACKAGE_MOD_DIR}/config"
    COMMAND "${CMAKE_COMMAND}" -E chdir "${LEVI_PACKAGE_ROOT}" "${CMAKE_COMMAND}" -E tar "cf" "${LEVI_PACKAGE_FILE}" --format=zip "${MOD_ID}"
    WORKING_DIRECTORY "${CMAKE_CURRENT_BINARY_DIR}"
    DEPENDS ${MOD_LIBRARY_NAME}
    COMMENT "Packaging ${MOD_ID} for LeviLauncher"
    VERBATIM
)

ENDOFFILE

          cat > manifest.json.in << 'ENDOFFILE'
{
  "type": "preload-native",
  "name": "@MOD_NAME@",
  "author": "@MOD_AUTHOR@",
  "description": "Change Minecraft Bedrock aspect ratio (Multiplier / Fixed modes). Port of the Java AspectRatio mod.",
  "version": "@MOD_VERSION@",
  "entry": "lib@MOD_LIBRARY_NAME@.so",
  "icon": "@MOD_ICON@",
  "minecraft_versions": @MOD_MINECRAFT_VERSIONS@
}

ENDOFFILE

          cat > config/config.json << 'ENDOFFILE'
{
  "version": 1,
  "enabled": true,
  "mode": 0,
  "ratio": 1.0
}

ENDOFFILE

          cat > config/config.schema.json << 'ENDOFFILE'
{
  "$schema": "http://json-schema.org/draft-07/schema#",
  "type": "object",
  "properties": {
    "version": { "type": "integer" },
    "enabled": { "type": "boolean" },
    "mode": {
      "type": "integer",
      "enum": [0, 1],
      "description": "0 = Multiplier, 1 = Fixed"
    },
    "ratio": {
      "type": "number",
      "minimum": 0.1,
      "maximum": 10.0
    }
  },
  "required": ["version", "enabled", "mode", "ratio"]
}

ENDOFFILE

          cat > src/main.cpp << 'ENDOFFILE'
#include "mod/AspectRatioMod.h"

#include <pl/Mod.hpp>

// Register the mod with Preloader / LeviLauncher
PL_REGISTER_MOD(aspectratio::AspectRatioMod, aspectratio::AspectRatioMod::instance());

ENDOFFILE

          cat > src/mod/Config.h << 'ENDOFFILE'
#pragma once

#include <string>

namespace aspectratio {

enum class Mode {
    Multiplier = 0,  // Force aspect = ratio
    Fixed      = 1   // aspect = (height/width) * ratio   (same as Java mod)
};

struct ModConfig {
    int version = 1;

    bool enabled = true;

    // 0 = Multiplier, 1 = Fixed
    int mode = 0;

    // Default 1.0 (same as the original Java mod)
    float ratio = 1.0f;
};

} // namespace aspectratio

ENDOFFILE

          cat > src/mod/Config.cpp << 'ENDOFFILE'
#include "mod/Config.h"

// This file exists so the config_generator and the mod share the same type.
// No extra logic needed.

ENDOFFILE

          cat > src/mod/AspectRatioMod.h << 'ENDOFFILE'
#pragma once

#include "mod/Config.h"

#include <pl/Config.hpp>
#include <pl/Mod.hpp>
#include <pl/memory/Hook.hpp>
#include <pl/memory/Signature.hpp>

#include <optional>

namespace aspectratio {

class AspectRatioMod {
public:
    static AspectRatioMod& instance();

    AspectRatioMod();

    [[nodiscard]] ll::mod::NativeMod& getSelf() const { return mSelf; }

    bool load();
    bool enable();
    bool disable();
    bool unload();

    // Called from the hooked function
    float modifyAspect(float originalAspect) const;

private:
    ll::mod::NativeMod& mSelf;
    ModConfig mConfig;
    std::optional<pl::config::ConfigFile<ModConfig>> mConfigFile;

    bool mHookInstalled = false;
    void* mOriginalGetPerspective = nullptr;

    void registerModMenu();
    void saveConfigToDisk();
};

} // namespace aspectratio

ENDOFFILE

          cat > src/mod/AspectRatioMod.cpp << 'ENDOFFILE'
#include "mod/AspectRatioMod.h"

#include <pl/Mod.hpp>
#include <pl/ModMenu.hpp>
#include <pl/memory/Hook.hpp>
#include <pl/memory/Signature.hpp>

#include <algorithm>
#include <cmath>
#include <filesystem>
#include <string>

namespace aspectratio {

// ---------------------------------------------------------------------------
// Signature for GetPerspective (from BedrockTools, arm64)
// May need updating for future Minecraft versions.
// ---------------------------------------------------------------------------
static constexpr const char* GET_PERSPECTIVE_PATTERN =
    "? ? ? A9 FD 03 00 91 ? ? ? F9 ? ? ? F9 ? ? ? F9 00 01 3F D6 ? ? ? F9 ? ? ? F9 ? ? ? A8 20 00 1F D6 ? ? ? A9 FD 03 00 91";

using GetPerspectiveFn = float (*)(void*);

static GetPerspectiveFn g_originalGetPerspective = nullptr;
static AspectRatioMod*  g_modInstance = nullptr;
static pl::memory::HookHandle g_hookHandle;

static float hookedGetPerspective(void* self) {
    float original = 1.777778f; // safe 16:9 fallback
    if (g_originalGetPerspective) {
        original = g_originalGetPerspective(self);
    }
    if (!g_modInstance) {
        return original;
    }
    return g_modInstance->modifyAspect(original);
}

// ---------------------------------------------------------------------------
// Module
// ---------------------------------------------------------------------------
AspectRatioMod& AspectRatioMod::instance() {
    static AspectRatioMod inst;
    return inst;
}

AspectRatioMod::AspectRatioMod() : mSelf(*ll::mod::NativeMod::current()) {
    g_modInstance = this;
}

float AspectRatioMod::modifyAspect(float originalAspect) const {
    if (!mConfig.enabled) {
        return originalAspect;
    }

    const float ratio = std::clamp(mConfig.ratio, 0.1f, 10.0f);

    switch (static_cast<Mode>(mConfig.mode)) {
        case Mode::Multiplier:
            // Java mod: force aspect = ratio
            return ratio;

        case Mode::Fixed: {
            // Java mod: (height / width) * ratio
            // originalAspect ≈ width/height → invert
            if (originalAspect > 0.001f) {
                const float inv = 1.0f / originalAspect;
                return inv * ratio;
            }
            return ratio;
        }
    }
    return originalAspect;
}

void AspectRatioMod::saveConfigToDisk() {
    if (mConfigFile) {
        mConfigFile->value() = mConfig;
        if (!mConfigFile->save()) {
            getSelf().getLogger().warn("Failed to save config");
        }
    }
}

void AspectRatioMod::registerModMenu() {
    using namespace pl::modmenu;

    ModuleBuilder("aspectratio.main", "Aspect Ratio")
        .description("Change the game's projection aspect ratio (port of the Java AspectRatio mod)")
        .modId("aspectratio")
        .defaultEnabled(mConfig.enabled)
        .onToggle([this](std::string_view /*moduleId*/, bool enabled) {
            mConfig.enabled = enabled;
            saveConfigToDisk();
            getSelf().getLogger().info("Aspect Ratio {}", enabled ? "enabled" : "disabled");
        })
        .onConfigChanged([this](std::string_view /*moduleId*/, std::string_view key,
                                std::string_view value) {
            if (key == "mode") {
                try {
                    int m = std::stoi(std::string(value));
                    mConfig.mode = (m == 1) ? 1 : 0;
                } catch (...) {}
            } else if (key == "ratio") {
                try {
                    mConfig.ratio = std::clamp(std::stof(std::string(value)), 0.1f, 10.0f);
                } catch (...) {}
            }
            saveConfigToDisk();
            getSelf().getLogger().info("Config updated: mode={}, ratio={:.3f}",
                                       mConfig.mode, mConfig.ratio);
        })
        // Mode: Radio (0 = Multiplier, 1 = Fixed)
        .config("mode", "Mode", ConfigType::Radio,
                std::to_string(mConfig.mode),
                "0", "1")
        // Ratio slider 0.1 – 5.0
        .config("ratio", "Ratio", ConfigType::SliderFloat,
                std::to_string(mConfig.ratio),
                "0.1", "5.0")
        .registerModule();
}

bool AspectRatioMod::load() {
    auto& self = getSelf();
    self.getLogger().info("Aspect Ratio mod loading...");

    std::error_code ec;
    std::filesystem::create_directories(self.getDataDir(), ec);
    std::filesystem::create_directories(self.getConfigDir(), ec);

    mConfigFile.emplace();
    if (!mConfigFile->load()) {
        self.getLogger().warn("Could not load config – using defaults");
        mConfig = ModConfig{};
    } else {
        mConfig = mConfigFile->value();
    }

    self.getLogger().info("Loaded. enabled={}, mode={}, ratio={:.3f}",
                          mConfig.enabled, mConfig.mode, mConfig.ratio);
    return true;
}

bool AspectRatioMod::enable() {
    auto& self = getSelf();
    self.getLogger().info("Aspect Ratio mod enabling...");

    // Always register the menu so the user can toggle / change settings
    registerModMenu();

    if (mHookInstalled) {
        return true;
    }

    uintptr_t addr = pl::memory::resolveSignature(GET_PERSPECTIVE_PATTERN, "libminecraftpe.so");
    if (addr == 0) {
        self.getLogger().error("Failed to find GetPerspective signature. "
                               "Minecraft version may not be supported (expected ~1.26.44).");
        // Menu still works; hook just won't be active
        return true;
    }

    self.getLogger().info("Found GetPerspective at 0x{:x}", addr);

    g_hookHandle = pl::memory::HookHandle(
        reinterpret_cast<pl::memory::FuncPtr>(addr),
        reinterpret_cast<pl::memory::FuncPtr>(hookedGetPerspective),
        reinterpret_cast<pl::memory::FuncPtr*>(&g_originalGetPerspective),
        pl::memory::HookPriority::Normal
    );

    if (!g_hookHandle.installed()) {
        self.getLogger().error("Failed to install GetPerspective hook");
        return true;
    }

    mHookInstalled = true;
    mOriginalGetPerspective = reinterpret_cast<void*>(g_originalGetPerspective);

    self.getLogger().info("Aspect Ratio hook installed successfully");
    return true;
}

bool AspectRatioMod::disable() {
    auto& self = getSelf();
    self.getLogger().info("Aspect Ratio mod disabling...");
    mConfig.enabled = false;
    saveConfigToDisk();
    pl::modmenu::unregisterModule("aspectratio.main");
    return true;
}

bool AspectRatioMod::unload() {
    getSelf().getLogger().info("Aspect Ratio mod unloading...");
    g_hookHandle.reset();
    pl::modmenu::unregisterModule("aspectratio.main");
    mConfigFile.reset();
    g_modInstance = nullptr;
    return true;
}

} // namespace aspectratio

ENDOFFILE

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Install CMake & Ninja
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build

      - name: Configure
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cmake -S . -B build-arm64-v8a \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DMOD_ID=aspectratio \
            -DMOD_NAME="Aspect Ratio" \
            -DMOD_AUTHOR="Grok" \
            -DMOD_VERSION=1.0.0 \
            -DMOD_LIBRARY_NAME=aspectratio \
            -DMOD_MINECRAFT_VERSIONS='["1.26.44"]'

      - name: Build + package
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cmake --build build-arm64-v8a --target aspectratio -j$(nproc)
          cmake --build build-arm64-v8a --target levi_package -j$(nproc)
          ls -la build-arm64-v8a/*.levipack

      - name: Upload levipack
        uses: actions/upload-artifact@v4
        with:
          name: aspectratio-1.0.0-arm64-v8a
          path: build-arm64-v8a/*.levipack
          if-no-files-found: error
         
